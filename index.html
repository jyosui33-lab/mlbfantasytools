<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB 打者统计查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Courier New', 'Roboto Mono', monospace;
            line-height: 1.6;
        }

        /* 顶部导航栏 */
        .navbar {
            background: linear-gradient(135deg, #0C5C0C 0%, #1a1a1a 100%);
            padding: 2rem;
            border-bottom: 2px solid #FFB81C;
        }

        .navbar-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }

        /* 搜索框 */
        .search-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 3rem;
            background-color: #ffffff;
            border: 2px solid #FFB81C;
            border-radius: 4px;
            font-size: 1rem;
            color: #1a1a1a;
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 184, 28, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #FFB81C;
        }

        /* 搜索结果下拉 */
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: #2a2a2a;
            border: 1px solid #FFB81C;
            border-radius: 4px;
            margin-top: 0.5rem;
            max-height: 300px;
            overflow-y: auto;
            z-index: 10;
            display: none;
        }

        .search-results.active {
            display: block;
        }

        .search-result-item {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #444;
            cursor: pointer;
            background-color: #2a2a2a;
            transition: background-color 0.2s;
        }

        .search-result-item:hover {
            background-color: #0C5C0C;
        }

        .result-name {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .result-info {
            font-size: 0.875rem;
            color: #aaa;
        }

        /* 主内容区 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 错误提示 */
        .error-message {
            background-color: #8B0000;
            color: #FFB81C;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 2rem;
            border-left: 4px solid #FFB81C;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        /* 加载指示 */
        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.5rem;
            color: #FFB81C;
            display: none;
        }

        .loading.active {
            display: block;
        }

        /* 打者信息卡片 */
        .player-card {
            background-color: #2a2a2a;
            border: 2px solid #0C5C0C;
            border-radius: 4px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: none;
        }

        .player-card.active {
            display: block;
        }

        .player-header {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            align-items: start;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid #444;
        }

        .player-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #FFB81C;
        }

        .player-info h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .player-info .position {
            color: #aaa;
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .stat-box {
            background-color: #1a1a1a;
            border: 1px solid #0C5C0C;
            border-radius: 4px;
            padding: 1rem;
            text-align: center;
        }

        .stat-label {
            color: #aaa;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #FFB81C;
        }

        /* 今日比赛信息 */
        .today-game {
            background-color: #2a2a2a;
            border: 2px solid #FFB81C;
            border-radius: 4px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: none;
        }

        .today-game.active {
            display: block;
        }

        .today-game h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #FFB81C;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .game-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            background-color: #1a1a1a;
            padding: 1.5rem;
            border-radius: 4px;
        }

        .game-info-item {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .game-info-label {
            color: #aaa;
            font-size: 0.875rem;
        }

        .game-info-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: #FFB81C;
        }

        /* 表格样式 */
        .stats-table {
            background-color: #2a2a2a;
            border: 2px solid #0C5C0C;
            border-radius: 4px;
            padding: 2rem;
            margin-bottom: 2rem;
            overflow-x: auto;
            display: none;
        }

        .stats-table.active {
            display: block;
        }

        .stats-table h3 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #FFB81C;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead {
            border-bottom: 2px solid #0C5C0C;
        }

        th {
            padding: 1rem;
            text-align: left;
            color: #FFB81C;
            font-weight: bold;
        }

        th:not(:first-child) {
            text-align: center;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #444;
        }

        td:not(:first-child) {
            text-align: center;
        }

        tbody tr:hover {
            background-color: #333;
        }

        .highlight {
            color: #FFB81C;
            font-weight: bold;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #aaa;
        }

        .empty-state-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
        }

        .empty-state-subtitle {
            font-size: 0.9rem;
            color: #666;
        }

        /* 提示框 */
        .info-box {
            background-color: #1a3a1a;
            border: 1px solid #0C5C0C;
            border-radius: 4px;
            padding: 1rem;
            color: #aaa;
            font-size: 0.875rem;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .navbar h1 {
                font-size: 1.75rem;
            }

            .player-header {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .game-info {
                grid-template-columns: 1fr;
            }

            th {
                font-size: 0.75rem;
                padding: 0.5rem;
            }

            td {
                padding: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="navbar">
        <div class="navbar-container">
            <h1>⚾ MLB 打者统计</h1>
            <div class="search-container">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="搜索打者名字..."
                >
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="container">
        <div class="error-message" id="errorMessage"></div>
        <div class="loading" id="loading">加载中...</div>

        <!-- 打者信息卡片 -->
        <div class="player-card" id="playerCard">
            <div class="player-header">
                <div class="player-info">
                    <h2 id="playerNumber">#0</h2>
                    <h3 id="playerName">选手名字</h3>
                    <div class="position" id="playerPosition">位置 • 球队</div>
                </div>
                <div class="stats-grid" id="seasonStatsGrid"></div>
            </div>
        </div>

        <!-- 今日比赛信息 -->
        <div class="today-game" id="todayGame">
            <h3>⚡ 今日比赛</h3>
            <div class="game-info" id="gameInfo"></div>
        </div>

        <!-- 近7场成绩表 -->
        <div class="stats-table" id="last7Table">
            <h3>📈 近7场成绩</h3>
            <table id="last7TableContent">
                <thead>
                    <tr>
                        <th>日期</th>
                        <th>对手</th>
                        <th>打数</th>
                        <th>安打</th>
                        <th>本垒打</th>
                        <th>打点</th>
                        <th>打率</th>
                    </tr>
                </thead>
                <tbody id="last7Body"></tbody>
            </table>
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <div class="empty-state-title">🔍 搜索 MLB 打者开始</div>
            <div class="empty-state-subtitle">输入打者名字查看近7场成绩、本季统计和对手投手历史数据</div>
        </div>

        <!-- 提示框 -->
        <div class="info-box" id="infoBox" style="display: none;">
            💡 数据来自 MLB Stats API。实时更新可能有延迟。
        </div>
    </div>

    <script>
        // 应用状态
        let appState = {
            selectedPlayer: null,
            searchQuery: '',
            isLoading: false
        };

        // DOM 元素缓存
        const elements = {
            searchInput: document.getElementById('searchInput'),
            searchResults: document.getElementById('searchResults'),
            errorMessage: document.getElementById('errorMessage'),
            loading: document.getElementById('loading'),
            playerCard: document.getElementById('playerCard'),
            playerNumber: document.getElementById('playerNumber'),
            playerName: document.getElementById('playerName'),
            playerPosition: document.getElementById('playerPosition'),
            seasonStatsGrid: document.getElementById('seasonStatsGrid'),
            todayGame: document.getElementById('todayGame'),
            gameInfo: document.getElementById('gameInfo'),
            last7Table: document.getElementById('last7Table'),
            last7Body: document.getElementById('last7Body'),
            emptyState: document.getElementById('emptyState'),
            infoBox: document.getElementById('infoBox')
        };

        // 事件监听器
        elements.searchInput.addEventListener('input', handleSearch);
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                elements.searchResults.classList.remove('active');
            }
        });

        // 显示/隐藏加载指示
        function setLoading(loading) {
            appState.isLoading = loading;
            elements.loading.classList.toggle('active', loading);
        }

        // 显示错误信息
        function showError(message) {
            elements.errorMessage.textContent = '⚠️ ' + message;
            elements.errorMessage.classList.add('active');
            setTimeout(() => {
                elements.errorMessage.classList.remove('active');
            }, 5000);
        }

        // 搜索打者
        async function handleSearch(e) {
            const query = e.target.value.trim();
            appState.searchQuery = query;

            if (!query) {
                elements.searchResults.classList.remove('active');
                return;
            }

            try {
                const response = await fetch(
                    `https://statsapi.mlb.com/api/v1/people/search?query=${encodeURIComponent(query)}`
                );
                const data = await response.json();
                displaySearchResults(data.people || []);
            } catch (error) {
                showError('搜索失败: ' + error.message);
            }
        }

        // 显示搜索结果
        function displaySearchResults(players) {
            if (players.length === 0) {
                elements.searchResults.classList.remove('active');
                return;
            }

            elements.searchResults.innerHTML = players.slice(0, 10).map(player => `
                <div class="search-result-item" onclick="selectPlayer(${player.id})">
                    <div class="result-name">${player.fullName}</div>
                    <div class="result-info">#${player.primaryNumber} • ${player.primaryPosition?.abbreviation || 'N/A'}</div>
                </div>
            `).join('');
            elements.searchResults.classList.add('active');
        }

        // 选择打者
        async function selectPlayer(playerId) {
            elements.searchResults.classList.remove('active');
            setLoading(true);

            try {
                // 获取打者信息
                const playerResponse = await fetch(
                    `https://statsapi.mlb.com/api/v1/people/${playerId}`
                );
                const playerData = await playerResponse.json();
                const player = playerData.people[0];
                appState.selectedPlayer = player;

                // 更新UI
                elements.playerNumber.textContent = '#' + player.primaryNumber;
                elements.playerName.textContent = player.fullName;
                elements.playerPosition.textContent = `${player.primaryPosition?.name || 'N/A'} • ${player.currentTeam?.name || 'N/A'}`;

                // 获取本季统计
                const statsResponse = await fetch(
                    `https://statsapi.mlb.com/api/v1/people/${playerId}/stat?group=hitting&type=season`
                );
                const statsData = await statsResponse.json();
                const seasonStats = statsData.stats[0]?.stats[0] || {};
                displaySeasonStats(seasonStats);

                // 获取近7场数据
                const logsResponse = await fetch(
                    `https://statsapi.mlb.com/api/v1/people/${playerId}/stat?group=hitting&type=gameLog&limit=7`
                );
                const logsData = await logsResponse.json();
                const gameLogs = logsData.stats[0]?.stats || [];
                displayLast7Games(gameLogs);

                // 获取今日比赛信息
                await fetchTodayGameInfo(player);

                // 显示相关内容
                updateUIVisibility();

            } catch (error) {
                showError('加载打者数据失败: ' + error.message);
            } finally {
                setLoading(false);
            }
        }

        // 显示本季统计
        function displaySeasonStats(stats) {
            const statsToShow = [
                { label: '打数', value: stats.atBats || 0 },
                { label: '安打', value: stats.hits || 0 },
                { label: '本垒打', value: stats.homeRuns || 0 },
                { label: '打点', value: stats.rbi || 0 },
                { label: '打率', value: (stats.avg || '0').substring(0, 5) },
                { label: '上垒率', value: (stats.obp || '0').substring(0, 5) },
                { label: '长打率', value: (stats.slg || '0').substring(0, 5) },
                { label: 'OPS', value: (stats.ops || '0').substring(0, 5) }
            ];

            elements.seasonStatsGrid.innerHTML = statsToShow.map(stat => `
                <div class="stat-box">
                    <div class="stat-label">${stat.label}</div>
                    <div class="stat-value">${stat.value}</div>
                </div>
            `).join('');
        }

        // 显示近7场数据
        function displayLast7Games(games) {
            if (games.length === 0) {
                elements.last7Body.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #aaa;">暂无近期比赛数据</td></tr>';
            } else {
                elements.last7Body.innerHTML = games.map((game, idx) => `
                    <tr>
                        <td>${game.date || 'N/A'}</td>
                        <td>${game.opponent || 'N/A'}</td>
                        <td>${game.atBats || 0}</td>
                        <td>${game.hits || 0}</td>
                        <td class="highlight">${game.homeRuns || 0}</td>
                        <td>${game.rbi || 0}</td>
                        <td>${(game.avg || '0').substring(0, 5)}</td>
                    </tr>
                `).join('');
            }
        }

        // 获取今日比赛信息
        async function fetchTodayGameInfo(player) {
            try {
                const today = new Date().toISOString().split('T')[0];
                const gamesResponse = await fetch(
                    `https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${today}`
                );
                const gamesData = await gamesResponse.json();

                const playerTeamId = player.currentTeam?.id;
                const todayGame = gamesData.dates[0]?.games.find(game =>
                    game.teams.away.team.id === playerTeamId || game.teams.home.team.id === playerTeamId
                );

                if (todayGame) {
                    const isHome = todayGame.teams.home.team.id === playerTeamId;
                    const opponent = isHome ? todayGame.teams.away : todayGame.teams.home;
                    const startingPitcher = isHome ? todayGame.teams.away.probablePitcher : todayGame.teams.home.probablePitcher;

                    let gameInfoHTML = `
                        <div class="game-info-item">
                            <div class="game-info-label">对手</div>
                            <div class="game-info-value">${opponent.team.name}</div>
                        </div>
                    `;

                    if (startingPitcher) {
                        gameInfoHTML += `
                            <div class="game-info-item">
                                <div class="game-info-label">先发投手</div>
                                <div class="game-info-value">${startingPitcher.fullName}</div>
                            </div>
                        `;
                    }

                    elements.gameInfo.innerHTML = gameInfoHTML;
                }
            } catch (error) {
                console.error('获取今日比赛信息失败:', error);
            }
        }

        // 更新UI可见性
        function updateUIVisibility() {
            const hasPlayer = appState.selectedPlayer !== null;

            elements.playerCard.classList.toggle('active', hasPlayer);
            elements.last7Table.classList.toggle('active', hasPlayer);
            elements.todayGame.classList.toggle('active', hasPlayer);
            elements.emptyState.classList.toggle('active', !hasPlayer);
            elements.infoBox.style.display = hasPlayer ? 'block' : 'none';
        }

        // 初始化
        updateUIVisibility();
    </script>
</body>
</html>
